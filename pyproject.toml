[project]
name = "devops-audit-agent"
version = "0.1.0"
description = "LLM agent that audits GitHub repositories for DevOps best-practice violations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
